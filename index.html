<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>滑动时钟 · 算出现在到那一刻还有多久</title>
<meta name="description" content="拖动 24 小时表盘选一个时刻，立刻算出从现在到那一刻还隔多少小时、多少分钟。范围覆盖今天到次日 23:59。" />
<meta name="theme-color" content="#f7f5f1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Ccircle%20cx='16'%20cy='16'%20r='12.5'%20fill='%23fffdfa'%20stroke='%23c9552f'%20stroke-width='2'/%3E%3Ccircle%20cx='16'%20cy='16'%20r='3.2'%20fill='%23c9552f'/%3E%3C/svg%3E" />
<style>
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100vh;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:#1a1917;
    background:#f7f5f1;
    background-image:radial-gradient(1100px 520px at 50% -200px,#fffdf7 0%,rgba(255,253,247,0) 72%);
    -webkit-font-smoothing:antialiased;
  }
  .glow{position:fixed;left:0;right:0;bottom:0;height:58vh;pointer-events:none;z-index:0;
    background:
      radial-gradient(560px 280px at 16% 104%,rgba(224,160,92,.13),transparent 70%),
      radial-gradient(620px 300px at 88% 96%,rgba(201,85,47,.09),transparent 70%);
  }
  .wrap{position:relative;z-index:1;width:100%;max-width:1000px;margin:0 auto;padding:clamp(28px,5vw,58px) clamp(18px,4vw,32px) 52px}

  .brand{display:flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.2em;color:#a59c8d}
  .brand svg{width:17px;height:17px;color:#c9552f;flex:none}
  h1{margin:16px 0 0;font-size:clamp(21px,3.1vw,30px);line-height:1.3;font-weight:600;letter-spacing:-.01em;color:#1a1917}
  .sub{margin:10px 0 0;font-size:14px;line-height:1.75;color:#8f8879;max-width:32em}

  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap}
  .head-text{min-width:0}
  .nav-link{flex:none;display:inline-flex;align-items:center;gap:7px;margin-top:16px;
    font-size:12.5px;color:#7d766a;text-decoration:none;letter-spacing:.02em;
    padding:9px 15px;border-radius:999px;border:1px solid #e8e1d5;background:#fffdfa;
    transition:color .16s,border-color .16s,background .16s,box-shadow .16s}
  .nav-link span{color:#c9552f;transition:transform .16s}
  .nav-link:hover{color:#c9552f;border-color:#eecdc2;background:#fdf3ef;box-shadow:0 5px 14px -9px rgba(201,85,47,.6)}
  .nav-link:hover span{transform:translateX(2px)}

  .board{
    margin-top:clamp(22px,3.6vw,36px);
    display:grid;grid-template-columns:minmax(0,392px) minmax(0,1fr);
    gap:clamp(18px,3.4vw,44px);align-items:center;
    background:#fffdfa;border:1px solid #ece5d9;border-radius:28px;
    padding:clamp(18px,3vw,32px);
    box-shadow:0 30px 72px -44px rgba(74,56,36,.42),0 2px 8px rgba(74,56,36,.03);
  }

  .dial-col{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
  .dial{position:relative;width:100%;max-width:372px;aspect-ratio:1/1;border-radius:50%;
    touch-action:none;cursor:grab;outline:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  .dial.dragging{cursor:grabbing}
  .dial:focus-visible{box-shadow:0 0 0 3px rgba(201,85,47,.18)}
  .dial svg{width:100%;height:100%;display:block}
  #knobG{transform-box:view-box;transform-origin:210px 210px}
  .readout{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;pointer-events:none;text-align:center}
  .ro-day{font-size:10.5px;font-weight:500;letter-spacing:.2em;color:#a89d8c;text-indent:.2em}
  .ro-time{font-size:clamp(30px,4.6vw,36px);font-weight:600;letter-spacing:-.01em;line-height:1.1;
    font-variant-numeric:tabular-nums;color:#232019}
  .ro-hint{font-size:11px;color:#b8b0a1;letter-spacing:.02em;margin-top:2px}
  .dial-note{margin:0;max-width:290px;text-align:center;font-size:11.5px;line-height:1.65;color:#b0a798}

  .panel{display:flex;flex-direction:column;gap:clamp(15px,2.2vw,20px);min-width:0}
  .row-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .now{font-size:12.5px;color:#9c9485;white-space:nowrap}
  .now b{margin-left:5px;font-size:14px;font-weight:600;color:#3b3630;font-variant-numeric:tabular-nums}
  .seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:#f4efe6;border:1px solid #ece5d9}
  .seg button{font-family:inherit;font-size:12.5px;color:#8f8879;background:transparent;border:0;border-radius:999px;
    padding:6px 15px;cursor:pointer;transition:background .18s,color .18s,box-shadow .18s}
  .seg button:hover{color:#3b3630}
  .seg button.on{background:#fffdfa;color:#c9552f;font-weight:600;box-shadow:0 1px 3px rgba(74,56,36,.12)}

  .eyebrow{font-size:11px;letter-spacing:.22em;color:#ada496}
  .hero{display:flex;align-items:baseline;flex-wrap:wrap;margin-top:8px;min-height:1em}
  .hero b{font-size:clamp(36px,5.6vw,50px);line-height:1;font-weight:600;letter-spacing:-.025em;
    color:#1a1917;font-variant-numeric:tabular-nums}
  .hero i{font-style:normal;font-size:13px;color:#9c9485;margin:0 14px 0 6px}
  .hero i:last-child{margin-right:0}
  .meta{margin-top:12px;font-size:12.5px;line-height:1.7;color:#9c9485}
  .meta b{color:#5a534a;font-weight:600;font-variant-numeric:tabular-nums}

  .cd{display:flex;align-items:center;gap:9px;padding:11px 14px;border-radius:13px;
    background:#fbf7f0;border:1px solid #f0e9dd;font-size:12.5px;color:#8f8879}
  .cd b{color:#bd4a2c;font-weight:600;font-size:13px;letter-spacing:.05em;font-variant-numeric:tabular-nums}
  .pulse{width:6px;height:6px;border-radius:50%;background:#c9552f;flex:none;animation:pulse 2.4s ease-out infinite}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(201,85,47,.42)}
    70%{box-shadow:0 0 0 7px rgba(201,85,47,0)}
    100%{box-shadow:0 0 0 0 rgba(201,85,47,0)}
  }

  .controls{display:flex;gap:8px;flex-wrap:wrap}
  .step{font-family:inherit;font-size:12.5px;color:#5a534a;background:#fffdfa;border:1px solid #e8e1d5;
    border-radius:11px;padding:9px 13px;cursor:pointer;font-variant-numeric:tabular-nums;
    transition:background .16s,border-color .16s,transform .1s}
  .step:hover{background:#f8f3ea;border-color:#ddd4c4}
  .step:active{transform:translateY(1px)}
  .step.ghost{color:#bd4a2c;background:#fdf3ef;border-color:#eecdc2}
  .step.ghost:hover{background:#fbe9e2}

  .presets{display:flex;flex-direction:column;gap:9px}
  .preset-label{font-size:11px;letter-spacing:.16em;color:#b8b0a1}
  .preset-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
  .presets button{font-family:inherit;font-size:12.5px;color:#7d766a;background:#f7f3ea;border:1px solid transparent;
    border-radius:10px;padding:8px 4px;cursor:pointer;text-align:center;font-variant-numeric:tabular-nums;
    transition:background .16s,color .16s,transform .1s}
  .presets button:hover{background:#f1e9db;color:#3b3630}
  .presets button:active{transform:translateY(1px)}

  .foot{margin-top:20px;display:flex;gap:9px;flex-wrap:wrap;justify-content:center;
    font-size:11.5px;color:#b8b0a1;text-align:center}

  @media (max-width:820px){
    .board{grid-template-columns:minmax(0,1fr);gap:22px;border-radius:24px}
    .dial{max-width:340px}
    .panel{width:100%;max-width:520px;margin:0 auto;gap:16px}
    .hero b{font-size:38px}
    .foot{font-size:11px}
  }
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>

<div class="wrap">
  <header class="head">
    <div class="head-text">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9.2" stroke="currentColor" stroke-width="1.7"/>
          <circle cx="12" cy="12" r="2.1" fill="currentColor"/>
        </svg>
        <span>滑 动 时 钟</span>
      </div>
      <h1>从现在，到你心里的那一刻</h1>
      <p class="sub">拖动表盘选一个时刻，顺便知道中间还隔着多少小时、多少分钟。</p>
    </div>
    <a class="nav-link" href="countdown/">倒数日 <span aria-hidden="true">→</span></a>
  </header>

  <main class="board">
    <section class="dial-col">
      <div class="dial" id="dial" role="slider" tabindex="0"
           aria-label="选择目标时刻" aria-valuemin="0" aria-valuemax="1439" aria-valuenow="450">
        <svg viewBox="0 0 420 420" aria-hidden="true">
          <defs>
            <radialGradient id="face" cx="50%" cy="36%" r="74%">
              <stop offset="0%" stop-color="#fffefc"/>
              <stop offset="58%" stop-color="#fcf9f3"/>
              <stop offset="100%" stop-color="#f4efe5"/>
            </radialGradient>
            <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#e3a96a"/>
              <stop offset="48%" stop-color="#cf6a3d"/>
              <stop offset="100%" stop-color="#b8412a"/>
            </linearGradient>
          </defs>

          <circle cx="210" cy="210" r="199" fill="url(#face)"/>
          <circle cx="210" cy="210" r="199.5" fill="none" stroke="#e9e2d6" stroke-width="1"/>

          <g id="ticks"></g>
          <g id="labels"></g>

          <path id="arcPath" d="" fill="none" stroke="url(#arcGrad)" stroke-width="3.6"
                stroke-linecap="round" opacity="0"/>
          <circle id="nowHalo" cx="210" cy="22" r="9" fill="#b08a3c" opacity=".16"/>
          <circle id="nowDot" cx="210" cy="22" r="4" fill="#b08a3c"/>

          <g id="knobG">
            <circle cx="210" cy="22" r="12.5" fill="#fffdfa"/>
            <circle cx="210" cy="22" r="8.4" fill="#c9552f"/>
          </g>
        </svg>

        <div class="readout">
          <div class="ro-day" id="roDay">明天</div>
          <div class="ro-time" id="roTime">07:30</div>
        </div>
      </div>
      <p class="dial-note">可选范围：今天现在之后 —— 次日 23:59</p>
    </section>

    <section class="panel">
      <div class="row-top">
        <div class="now">现在<b id="nowTime">01:30:07</b></div>
        <div class="seg" id="seg" role="group" aria-label="选择日期">
          <button type="button" data-day="0">今天</button>
          <button type="button" data-day="1">明天</button>
        </div>
      </div>

      <div class="result">
        <div class="eyebrow">时 间 间 隔</div>
        <div class="hero" id="hero"><b>6</b><i>小时</i><b>0</b><i>分钟</i></div>
        <div class="meta">共 <b id="totalMin">360</b> 分钟 · 目标 <b id="targetDate">11 月 10 日 周二 07:30</b></div>
      </div>

      <div class="cd">
        <span class="pulse" aria-hidden="true"></span>
        <span>距离那一刻还有</span>
        <b id="cdText">05:59:30</b>
      </div>

      <div class="controls">
        <button class="step" type="button" data-step="-5">− 5 分</button>
        <button class="step" type="button" data-step="-1">− 1 分</button>
        <button class="step" type="button" data-step="1">+ 1 分</button>
        <button class="step" type="button" data-step="5">+ 5 分</button>
        <button class="step ghost" type="button" id="nowBtn">此刻</button>
      </div>

      <div class="presets">
        <span class="preset-label">常用</span>
        <div class="preset-grid">
          <button type="button" data-preset="390">06:30</button>
          <button type="button" data-preset="420">07:00</button>
          <button type="button" data-preset="450">07:30</button>
          <button type="button" data-preset="480">08:00</button>
          <button type="button" data-preset="690">11:30</button>
          <button type="button" data-preset="720">12:00</button>
          <button type="button" data-preset="1050">17:30</button>
          <button type="button" data-preset="1080">18:00</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span>间隔按顺时针最近一次到达计算</span><span>·</span>
    <span>全部在本地运算，不上传任何数据</span>
  </footer>
</div>

<script>
(function () {
  'use strict';

  var CX = 210, CY = 210, RT = 188;      // 圆心与轨迹半径
  var dial     = document.getElementById('dial');
  var knobG    = document.getElementById('knobG');
  var nowDot   = document.getElementById('nowDot');
  var nowHalo  = document.getElementById('nowHalo');
  var arcPath  = document.getElementById('arcPath');
  var roDay    = document.getElementById('roDay');
  var roTime   = document.getElementById('roTime');
  var nowTimeEl= document.getElementById('nowTime');
  var heroEl   = document.getElementById('hero');
  var totalMinEl = document.getElementById('totalMin');
  var targetEl = document.getElementById('targetDate');
  var cdText   = document.getElementById('cdText');
  var segBtns  = Array.prototype.slice.call(document.querySelectorAll('#seg button'));

  var WEEK = ['周日','周一','周二','周三','周四','周五','周六'];

  var target = 450;   // 目标时刻：当天 0..1439 分钟
  var offset = 0;     // 0 = 今天，1 = 明天
  var dragging = false;

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function polar(r, deg) {
    var a = (deg - 90) * Math.PI / 180;
    return [CX + r * Math.cos(a), CY + r * Math.sin(a)];
  }

  /* ---------- 刻度 ---------- */
  (function buildTicks() {
    var NS = 'http://www.w3.org/2000/svg';
    var ticksG = document.getElementById('ticks');
    var labelsG = document.getElementById('labels');
    for (var i = 0; i < 24; i++) {
      var deg = i * 15, key = i % 6 === 0;
      var p1 = polar(key ? 160 : 168, deg), p2 = polar(178, deg);
      var ln = document.createElementNS(NS, 'line');
      ln.setAttribute('x1', p1[0].toFixed(2)); ln.setAttribute('y1', p1[1].toFixed(2));
      ln.setAttribute('x2', p2[0].toFixed(2)); ln.setAttribute('y2', p2[1].toFixed(2));
      ln.setAttribute('stroke', key ? '#cfc4b0' : '#e3dacb');
      ln.setAttribute('stroke-width', key ? '2.2' : '1.3');
      ln.setAttribute('stroke-linecap', 'round');
      ticksG.appendChild(ln);

      var lp = polar(145, deg);
      var t = document.createElementNS(NS, 'text');
      t.setAttribute('x', lp[0].toFixed(2));
      t.setAttribute('y', lp[1].toFixed(2));
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('dominant-baseline', 'central');
      t.setAttribute('font-size', '10.5');
      t.setAttribute('font-weight', key ? '600' : '500');
      t.setAttribute('fill', key ? '#948b7b' : '#b0a798');
      t.textContent = pad(i);
      labelsG.appendChild(t);
    }
  })();

  /* ---------- 目标时刻 ---------- */
  function targetDate(now) {
    var base = new Date(now);
    base.setHours(0, 0, 0, 0);
    var d = new Date(base);
    d.setDate(d.getDate() + offset);
    d.setMinutes(target);
    // 已经过去（留 60 秒宽限）→ 顺延到明天，保证“顺时针最近一次”
    if (offset === 0 && now.getTime() - d.getTime() > 60000) {
      offset = 1;
      d = new Date(base);
      d.setDate(d.getDate() + 1);
      d.setMinutes(target);
    }
    return d;
  }

  /* ---------- 圆弧 ---------- */
  function arc(a1, a2, diffMs) {
    if (diffMs < 30000) return { path: '', opacity: 0 };
    var sweep = (a2 - a1 + 360) % 360;
    if (sweep < 0.6) sweep = 360;             // 刚好跑满一圈
    var p1 = polar(RT, a1);
    if (sweep >= 359.9) {
      var q = polar(RT, a1);
      return {
        path: 'M' + q[0].toFixed(2) + ' ' + q[1].toFixed(2) +
              ' A' + RT + ' ' + RT + ' 0 1 1 ' + (q[0] - 0.01).toFixed(2) + ' ' + q[1].toFixed(2),
        opacity: 1
      };
    }
    var p2 = polar(RT, a2);
    var large = sweep > 180 ? 1 : 0;
    return {
      path: 'M' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2) +
            ' A' + RT + ' ' + RT + ' 0 ' + large + ' 1 ' + p2[0].toFixed(2) + ' ' + p2[1].toFixed(2),
      opacity: 1
    };
  }

  /* ---------- 渲染 ---------- */
  function render() {
    var now = new Date();
    var nowMin = now.getHours() * 60 + now.getMinutes();
    var nowSec = nowMin * 60 + now.getSeconds() + now.getMilliseconds() / 1000;

    var td = targetDate(now);
    var diff = td.getTime() - now.getTime();
    if (diff < 0) diff = 0;

    var totalMin = Math.floor(diff / 60000);
    var h = Math.floor(totalMin / 60), m = totalMin % 60;

    /* 中央读数 */
    roTime.textContent = pad(Math.floor(target / 60)) + ':' + pad(target % 60);
    roDay.textContent = offset === 1 ? '明天' : '今天';

    /* 大数字 */
    if (h > 0) {
      heroEl.innerHTML = '<b>' + h + '</b><i>小时</i><b>' + m + '</b><i>分钟</i>';
    } else {
      heroEl.innerHTML = '<b>' + m + '</b><i>分钟</i>';
    }

    totalMinEl.textContent = totalMin.toLocaleString('en-US');
    targetEl.textContent = (td.getMonth() + 1) + ' 月 ' + td.getDate() + ' 日 ' +
      WEEK[td.getDay()] + ' ' + pad(td.getHours()) + ':' + pad(td.getMinutes());

    var s = Math.floor(diff / 1000);
    cdText.textContent = pad(Math.floor(s / 3600)) + ':' +
      pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60);

    nowTimeEl.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());

    /* 表盘 */
    var aTarget = (target / 1440) * 360;
    knobG.style.transform = 'rotate(' + aTarget.toFixed(2) + 'deg)';

    var aNow = (nowSec / 86400) * 360;
    var np = polar(RT, aNow);
    nowDot.setAttribute('cx', np[0].toFixed(2));
    nowDot.setAttribute('cy', np[1].toFixed(2));
    nowHalo.setAttribute('cx', np[0].toFixed(2));
    nowHalo.setAttribute('cy', np[1].toFixed(2));

    var a = arc(aNow, aTarget, diff);
    arcPath.setAttribute('d', a.path);
    arcPath.setAttribute('opacity', a.opacity);

    /* 状态 */
    for (var i = 0; i < segBtns.length; i++) {
      segBtns[i].classList.toggle('on', Number(segBtns[i].dataset.day) === offset);
    }
    dial.setAttribute('aria-valuenow', target);
    dial.setAttribute('aria-valuetext',
      (offset === 1 ? '明天 ' : '今天 ') + pad(Math.floor(target / 60)) + ':' + pad(target % 60));

    if (!dragging) persist();
  }

  var lastHash = '';
  function persist() {
    var h = '#t=' + target + '&d=' + offset;
    if (h === lastHash) return;
    lastHash = h;
    try {
      history.replaceState(null, '', h);
    } catch (e) { /* file:// 或沙箱环境忽略 */ }
  }

  /* ---------- 交互 ---------- */
  function pos(e) {
    var r = dial.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var dx = e.clientX - cx, dy = e.clientY - cy;
    var ang = Math.atan2(dx, -dy) * 180 / Math.PI;
    if (ang < 0) ang += 360;
    return { angle: ang, dist: Math.hypot(dx, dy), unit: r.width / 420 };
  }

  function applyAngle(angle) {
    var now = new Date();
    var nowMin = now.getHours() * 60 + now.getMinutes();
    var mins = Math.round(angle / 360 * 1440) % 1440;
    if (offset === 0 && mins < nowMin) offset = 1;   // 滑到已过去的时刻 → 自动顺延到明天
    target = mins;
    render();
  }

  dial.addEventListener('pointerdown', function (e) {
    var p = pos(e);
    if (p.dist < p.unit * 56) return;                // 中心读数区不响应
    dragging = true;
    dial.classList.add('dragging');
    if (dial.setPointerCapture) { try { dial.setPointerCapture(e.pointerId); } catch (err) {} }
    applyAngle(p.angle);
  });

  dial.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    applyAngle(pos(e).angle);
  });

  ['pointerup', 'pointercancel'].forEach(function (t) {
    dial.addEventListener(t, function (e) {
      if (!dragging) return;
      dragging = false;
      dial.classList.remove('dragging');
      if (dial.hasPointerCapture && dial.hasPointerCapture(e.pointerId)) {
        try { dial.releasePointerCapture(e.pointerId); } catch (err) {}
      }
      persist();
    });
  });

  function nudge(delta) {
    var now = new Date();
    var nowMin = now.getHours() * 60 + now.getMinutes();
    var abs = offset * 1440 + target + delta;
    if (abs < nowMin) abs = nowMin;                  // 不早于此刻
    if (abs > 2879) abs = 2879;                      // 最远到明天 23:59
    offset = Math.floor(abs / 1440);
    target = abs % 1440;
    render();
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-step]'), function (b) {
    b.addEventListener('click', function () { nudge(Number(b.dataset.step)); });
  });

  document.getElementById('nowBtn').addEventListener('click', function () {
    var n = new Date();
    target = n.getHours() * 60 + n.getMinutes();
    offset = 0;
    render();
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-preset]'), function (b) {
    b.addEventListener('click', function () {
      var v = Number(b.dataset.preset);
      var n = new Date();
      var nowMin = n.getHours() * 60 + n.getMinutes();
      target = v % 1440;
      offset = v < nowMin ? 1 : 0;
      render();
    });
  });

  segBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      var dv = Number(b.dataset.day);
      if (dv === 0) {
        var n = new Date();
        var nowMin = n.getHours() * 60 + n.getMinutes();
        if (target < nowMin) target = nowMin;
        offset = 0;
      } else {
        offset = 1;
      }
      render();
    });
  });

  dial.addEventListener('keydown', function (e) {
    var d = 0;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') d = e.shiftKey ? 5 : 1;
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') d = e.shiftKey ? -5 : -1;
    else if (e.key === 'PageUp') d = 60;
    else if (e.key === 'PageDown') d = -60;
    else return;
    e.preventDefault();
    nudge(d);
  });

  /* ---------- 初始化 ---------- */
  (function init() {
    var now = new Date();
    var nowMin = now.getHours() * 60 + now.getMinutes();
    var m = /t=(\d{1,4})(?:&d=([01]))?/.exec(location.hash);
    if (m && Number(m[1]) <= 1439) {
      target = Number(m[1]);
      offset = m[2] ? Number(m[2]) : 0;
    } else {
      var v = Math.round((nowMin + 360) / 5) * 5;   // 默认：现在 +6 小时
      offset = v >= 1440 ? 1 : 0;
      target = v % 1440;
    }
    render();
    setInterval(render, 1000);
  })();
})();
</script>
</body>
</html>
