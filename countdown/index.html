<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>倒数日 · 距离那一天还有多少天</title>
<meta name="description" content="选一个日期，立刻看到已经过去多少天、或者还要等多少天。支持日期选择、月历点选、周数与月份换算。" />
<meta name="theme-color" content="#f7f5f1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20x='5'%20y='7'%20width='22'%20height='20'%20rx='5'%20fill='%23fffdfa'%20stroke='%23c9552f'%20stroke-width='2'/%3E%3Cpath%20d='M5%2013.5h22'%20stroke='%23c9552f'%20stroke-width='2'/%3E%3Ccircle%20cx='16'%20cy='20.5'%20r='2.6'%20fill='%23c9552f'/%3E%3C/svg%3E" />
<style>
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100vh;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:#1a1917;background:#f7f5f1;
    background-image:radial-gradient(1100px 520px at 50% -200px,#fffdf7 0%,rgba(255,253,247,0) 72%);
    -webkit-font-smoothing:antialiased;
  }
  .glow{position:fixed;left:0;right:0;bottom:0;height:58vh;pointer-events:none;z-index:0;
    background:
      radial-gradient(560px 280px at 16% 104%,rgba(224,160,92,.13),transparent 70%),
      radial-gradient(620px 300px at 88% 96%,rgba(201,85,47,.09),transparent 70%);
  }
  .wrap{position:relative;z-index:1;width:100%;max-width:1000px;margin:0 auto;padding:clamp(28px,5vw,58px) clamp(18px,4vw,32px) 52px}

  .brand{display:flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.2em;color:#a59c8d}
  .brand svg{width:17px;height:17px;color:#c9552f;flex:none}
  h1{margin:16px 0 0;font-size:clamp(21px,3.1vw,30px);line-height:1.3;font-weight:600;letter-spacing:-.01em;color:#1a1917}
  .sub{margin:10px 0 0;font-size:14px;line-height:1.75;color:#8f8879;max-width:32em}

  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap}
  .head-text{min-width:0}
  .nav-link{flex:none;display:inline-flex;align-items:center;gap:7px;margin-top:16px;
    font-size:12.5px;color:#7d766a;text-decoration:none;letter-spacing:.02em;
    padding:9px 15px;border-radius:999px;border:1px solid #e8e1d5;background:#fffdfa;
    transition:color .16s,border-color .16s,background .16s,box-shadow .16s}
  .nav-link span{color:#c9552f;transition:transform .16s}
  .nav-link:hover{color:#c9552f;border-color:#eecdc2;background:#fdf3ef;box-shadow:0 5px 14px -9px rgba(201,85,47,.6)}
  .nav-link:hover span{transform:translateX(-2px)}

  .board{
    margin-top:clamp(22px,3.6vw,36px);
    background:#fffdfa;border:1px solid #ece5d9;border-radius:28px;
    padding:clamp(18px,3vw,30px);
    box-shadow:0 30px 72px -44px rgba(74,56,36,.42),0 2px 8px rgba(74,56,36,.03);
  }

  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding-bottom:clamp(14px,2.2vw,18px);border-bottom:1px dashed #ece5d9}
  .date-field{position:relative;display:flex;align-items:center;gap:4px;padding:5px 5px 5px 12px;
    border:1px solid #e8e1d5;border-radius:12px;background:#fffefb;
    transition:border-color .16s,box-shadow .16s}
  .date-field:focus-within{border-color:#e0b9a8;box-shadow:0 0 0 3px rgba(201,85,47,.10)}
  .segs{display:flex;align-items:center;gap:0}
  .segs input{border:0;background:transparent;outline:none;font-family:inherit;font-size:13.5px;
    color:#3b3630;font-variant-numeric:tabular-nums;letter-spacing:.05em;padding:3px 0;
    text-align:center;border-radius:5px;transition:background .14s}
  .segs input:focus{background:#f8f3ea}
  #iY{width:38px}#iM{width:22px}#iD{width:22px}
  .segs .sep{color:#bdb3a2;font-size:12px;line-height:1;margin:0 1px;-webkit-user-select:none;user-select:none}
  .segs input::placeholder{color:#cfc7b8;letter-spacing:.02em}
  .picker-btn{flex:none;width:27px;height:27px;display:grid;place-items:center;margin-left:5px;
    border-radius:8px;background:#f6f1e7;color:#a89d8c;pointer-events:none;
    transition:background .14s,color .14s}
  .picker-btn svg{width:14px;height:14px}
  .date-field:hover .picker-btn{background:#f1e9db;color:#c9552f}
  .native-picker{position:absolute;right:5px;top:5px;width:27px;height:27px;z-index:2;
    opacity:0;border:0;padding:0;cursor:pointer;font-size:0}
  .date-field.invalid{border-color:#e2a08c;box-shadow:0 0 0 3px rgba(201,85,47,.12);animation:shake .3s}
  .date-field.invalid #dt{color:#c9552f}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}
  .chips button{font-family:inherit;font-size:12px;color:#7d766a;background:#f7f3ea;border:1px solid transparent;
    border-radius:999px;padding:7px 13px;cursor:pointer;font-variant-numeric:tabular-nums;
    transition:background .16s,color .16s,border-color .16s}
  .chips button:hover{background:#f1e9db;color:#3b3630}
  .chips button.on{background:#fdf3ef;color:#c9552f;border-color:#eecdc2;font-weight:600}

  .body{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:clamp(22px,3.6vw,44px);
    align-items:center;padding-top:clamp(18px,3vw,30px)}

  .hero{min-width:0}
  .status{font-size:11.5px;letter-spacing:.24em;color:#a89d8c;transition:color .2s}
  .status.past{color:#a8863c}
  .status.future{color:#c9552f}
  .big{display:flex;align-items:baseline;gap:9px;margin-top:8px;min-height:1em}
  .big b{font-size:clamp(56px,8.6vw,86px);line-height:.94;font-weight:600;letter-spacing:-.035em;
    font-variant-numeric:tabular-nums;color:#1a1917}
  .big i{font-style:normal;font-size:14.5px;color:#9c9485;letter-spacing:.04em}
  .big .word{font-size:clamp(46px,7vw,68px);letter-spacing:.02em}

  .target-line{margin-top:12px;font-size:13px;color:#8f8879;letter-spacing:.01em}
  .target-line b{color:#4a4640;font-weight:600}

  .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px 20px;
    margin-top:clamp(18px,2.8vw,26px);padding-top:clamp(15px,2.4vw,20px);border-top:1px dashed #ece5d9}
  .stat{display:flex;flex-direction:column;gap:5px;min-width:0}
  .stat span{font-size:11px;color:#b3aa9b;letter-spacing:.08em}
  .stat b{font-size:13.5px;font-weight:600;color:#4a4640;font-variant-numeric:tabular-nums;white-space:nowrap}

  .cal-wrap{background:#fbf8f2;border:1px solid #f0e9dd;border-radius:20px;padding:13px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .cal-head button{width:28px;height:28px;border-radius:9px;border:1px solid #e8e1d5;background:#fffdfa;
    color:#8f8879;cursor:pointer;font-size:15px;line-height:1;padding:0 0 2px;font-family:inherit;
    transition:background .14s,color .14s,border-color .14s}
  .cal-head button:hover{background:#f4efe6;color:#c9552f;border-color:#e9cfc3}
  .cal-title{font-size:13px;font-weight:600;color:#3b3630;letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-dow{font-size:10.5px;color:#bab1a1;text-align:center;padding:4px 0 5px}
  .cal-day{height:31px;border:0;background:transparent;border-radius:9px;font-family:inherit;
    font-size:12.5px;color:#5a534a;cursor:pointer;font-variant-numeric:tabular-nums;
    transition:background .14s,color .14s,box-shadow .14s}
  .cal-day.blank{cursor:default}
  .cal-day:hover{background:#f1e9db}
  .cal-day.today{box-shadow:inset 0 0 0 1px #dcc9a6;color:#a8863c;font-weight:600}
  .cal-day.on{background:#c9552f;color:#fff;font-weight:600;box-shadow:none}
  .cal-day.on:hover{background:#bf4c28}
  .cal-tip{margin:9px 0 1px;font-size:10.5px;color:#bab1a1;text-align:center;letter-spacing:.02em}

  .foot{margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:12px;
    font-size:11.5px;color:#b8b0a1;text-align:center}
  .foot-note{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
  .foot-link{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;
    border:1px solid #e8e1d5;background:#fffdfa;font-size:12px;color:#7d766a;text-decoration:none;
    transition:color .16s,border-color .16s,background .16s,box-shadow .16s}
  .foot-link svg{width:12px;height:12px;color:#c9552f;flex:none;transition:transform .16s}
  .foot-link:hover{color:#c9552f;border-color:#eecdc2;background:#fdf3ef;
    box-shadow:0 5px 14px -9px rgba(201,85,47,.6)}
  .foot-link:hover svg{transform:translate(1px,-1px)}

  @media (max-width:820px){
    .board{border-radius:24px}
    .body{grid-template-columns:minmax(0,1fr);gap:24px}
    .cal-wrap{width:100%;max-width:330px;margin:0 auto;order:-1}
    .chips{margin-left:0}
    .big b{font-size:62px}
    .foot{font-size:11px}
  }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>

<div class="wrap">
  <header class="head">
    <div class="head-text">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3.6" y="5.4" width="16.8" height="15" rx="3.4" stroke="currentColor" stroke-width="1.7"/>
          <path d="M3.6 10h16.8" stroke="currentColor" stroke-width="1.7"/>
          <circle cx="12" cy="15.2" r="2.1" fill="currentColor"/>
        </svg>
        <span>倒 数 日</span>
      </div>
      <h1>把日子，数清楚</h1>
      <p class="sub">选一个日期，看看已经过了多少天，或者还要等多少天。</p>
    </div>
    <a class="nav-link" href="../"><span aria-hidden="true">←</span> 滑动时钟</a>
  </header>

  <main class="board">
    <div class="toolbar">
      <div class="date-field" id="dateField">
        <div class="segs">
          <input id="iY" inputmode="numeric" maxlength="4" placeholder="YYYY"
                 autocomplete="off" spellcheck="false" aria-label="年" />
          <span class="sep">-</span>
          <input id="iM" inputmode="numeric" maxlength="2" placeholder="MM"
                 autocomplete="off" spellcheck="false" aria-label="月" />
          <span class="sep">-</span>
          <input id="iD" inputmode="numeric" maxlength="2" placeholder="DD"
                 autocomplete="off" spellcheck="false" aria-label="日" />
        </div>
        <span class="picker-btn" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="3.6" y="5.4" width="16.8" height="15" rx="3.4" stroke="currentColor" stroke-width="1.7"/>
            <path d="M3.6 10h16.8" stroke="currentColor" stroke-width="1.7"/>
            <path d="M8 3.4v3.2M16 3.4v3.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </span>
        <input type="date" id="picker" class="native-picker" tabindex="-1" aria-label="打开日历选择" />
      </div>
      <div class="chips" id="chips"></div>
    </div>

    <div class="body">
      <section class="hero">
        <div class="status" id="status">还有</div>
        <div class="big" id="big"><b>49</b><i>天</i></div>
        <div class="target-line" id="targetLine">2026 年 12 月 31 日 · 周四</div>
        <div class="stats">
          <div class="stat"><span>相 距</span><b id="stYMD">1 个月 19 天</b></div>
          <div class="stat"><span>折 合</span><b id="stWeeks">7 周 0 天</b></div>
          <div class="stat"><span>约</span><b id="stMonths">1 个月 19 天</b></div>
          <div class="stat"><span>一年中的第</span><b id="stDoy">365 天</b></div>
        </div>
      </section>

      <aside class="cal-wrap">
        <div class="cal-head">
          <button type="button" id="prevM" aria-label="上个月">‹</button>
          <div class="cal-title" id="calTitle">2026 年 12 月</div>
          <button type="button" id="nextM" aria-label="下个月">›</button>
        </div>
        <div class="cal" id="cal" role="grid" aria-label="日历"></div>
        <p class="cal-tip">点任意日期即可切换</p>
      </aside>
    </div>
  </main>

  <footer class="foot">
    <div class="foot-note">
      <span>按自然日计算，不含时分秒</span><span>·</span>
      <span>全部在本地运算，不上传任何数据</span>
    </div>
    <a class="foot-link" href="https://kindle.139t.cn">
      墨水屏时钟
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M8 16L16 8M16 8H9.6M16 8v6.4" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </footer>
</div>

<script>
(function () {
  'use strict';

  var WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  var DOW  = ['一', '二', '三', '四', '五', '六', '日'];

  var iY        = document.getElementById('iY');
  var iM        = document.getElementById('iM');
  var iD        = document.getElementById('iD');
  var segs      = [iY, iM, iD];
  var picker    = document.getElementById('picker');
  var dateField = document.getElementById('dateField');
  var statusEl  = document.getElementById('status');
  var bigEl     = document.getElementById('big');
  var targetEl  = document.getElementById('targetLine');
  var stWeeks   = document.getElementById('stWeeks');
  var stYMD     = document.getElementById('stYMD');
  var stMonths  = document.getElementById('stMonths');
  var stDoy     = document.getElementById('stDoy');
  var cal       = document.getElementById('cal');
  var calTitle  = document.getElementById('calTitle');
  var chips     = document.getElementById('chips');

  var today = strip(new Date());
  var target = new Date(today.getFullYear(), 11, 31);
  var viewY = target.getFullYear();
  var viewM = target.getMonth();

  /* 法定节假日：元旦 / 春节 / 清明 / 劳动节 / 端午 / 中秋 / 国庆 */
  var HOLIDAYS = [
    ['元旦', 2026, 1, 1],  ['春节', 2026, 2, 17], ['清明', 2026, 4, 5],
    ['劳动节', 2026, 5, 1], ['端午', 2026, 6, 19], ['中秋', 2026, 9, 25], ['国庆', 2026, 10, 1],
    ['元旦', 2027, 1, 1],  ['春节', 2027, 2, 6],  ['清明', 2027, 4, 5],
    ['劳动节', 2027, 5, 1], ['端午', 2027, 6, 9],  ['中秋', 2027, 9, 15], ['国庆', 2027, 10, 1],
    ['元旦', 2028, 1, 1],  ['春节', 2028, 1, 26], ['清明', 2028, 4, 4],
    ['劳动节', 2028, 5, 1], ['端午', 2028, 5, 28], ['中秋', 2028, 10, 3], ['国庆', 2028, 10, 1],
    ['元旦', 2029, 1, 1],  ['春节', 2029, 2, 13], ['清明', 2029, 4, 4],
    ['劳动节', 2029, 5, 1], ['端午', 2029, 6, 16], ['中秋', 2029, 9, 22], ['国庆', 2029, 10, 1]
  ];

  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function strip(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function iso(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
  function parseISO(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
    if (!m) return null;
    var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return isNaN(d.getTime()) ? null : d;
  }
  function isLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
  function daysInMonth(y, mo) {
    return mo === 2 ? (isLeap(y) ? 29 : 28)
                    : [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][mo - 1];
  }
  function makeDate(y, mo, d) {
    if (!(y >= 1 && y <= 9999) || !(mo >= 1 && mo <= 12)) return null;
    if (!(d >= 1 && d <= daysInMonth(y, mo))) return null;
    var x = new Date(2000, 0, 1);
    x.setFullYear(y, mo - 1, d);     // 避免 0-99 被当成 19xx
    x.setHours(0, 0, 0, 0);
    return isNaN(x.getTime()) ? null : x;
  }
  /* 宽松解析：1995 / 1995-1 / 1995-1-1 / 1995/01/01 / 19950101 / 1995年1月1日 */
  function parseLoose(s) {
    if (s === null || s === undefined) return null;
    s = String(s).trim()
      .replace(/[年月]/g, '-')
      .replace(/[日号]/g, '')
      .replace(/[\s./\\]+/g, '-')
      .replace(/-+/g, '-')
      .replace(/^-/, '').replace(/-$/, '');
    if (!s) return null;
    var m;
    if ((m = /^(\d{4})$/.exec(s))) return makeDate(+m[1], 1, 1);
    if ((m = /^(\d{4})-(\d{1,2})$/.exec(s))) return makeDate(+m[1], +m[2], 1);
    if ((m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s))) return makeDate(+m[1], +m[2], +m[3]);
    if ((m = /^(\d{4})(\d{1,2})(\d{1,2})$/.exec(s))) return makeDate(+m[1], +m[2], +m[3]);
    return null;
  }
  function dayDiff(a, b) {
    return Math.round((Date.UTC(a.getFullYear(), a.getMonth(), a.getDate()) -
                       Date.UTC(b.getFullYear(), b.getMonth(), b.getDate())) / 86400000);
  }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return strip(x); }

  /* a <= b：相差几年几个月几天（借位按上一个月的实际天数） */
  function ymdDiff(a, b) {
    var y = b.getFullYear() - a.getFullYear();
    var m = b.getMonth() - a.getMonth();
    var d = b.getDate() - a.getDate();
    if (d < 0) { m -= 1; d += new Date(b.getFullYear(), b.getMonth(), 0).getDate(); }
    if (m < 0) { y -= 1; m += 12; }
    return { y: y, m: m, d: d };
  }
  function fmtYMD(o) {
    if (o.y) return o.y + ' 年 ' + o.m + ' 个月 ' + o.d + ' 天';
    if (o.m) return o.m + ' 个月 ' + o.d + ' 天';
    return o.d + ' 天';
  }

  function upcomingHolidays(n) {
    var list = [];
    for (var i = 0; i < HOLIDAYS.length; i++) {
      var h = HOLIDAYS[i];
      var d = new Date(h[1], h[2] - 1, h[3]);
      if (d >= today) list.push({ name: h[0], date: d });
    }
    list.sort(function (a, b) { return a.date - b.date; });
    return list.slice(0, n);
  }

  var chipSig = '';
  function buildChips() {
    var hs = upcomingHolidays(3);
    var sig = hs.map(function (h) { return h.name + iso(h.date); }).join('|');
    if (sig === chipSig) return;
    chipSig = sig;
    chips.innerHTML = hs.map(function (h) {
      return '<button type="button" data-date="' + iso(h.date) + '">' + h.name + ' ' +
        p2(h.date.getMonth() + 1) + '-' + p2(h.date.getDate()) + '</button>';
    }).join('');
  }

  function renderCal() {
    calTitle.textContent = viewY + ' 年 ' + (viewM + 1) + ' 月';
    var html = '';
    for (var i = 0; i < 7; i++) html += '<div class="cal-dow">' + DOW[i] + '</div>';

    var first = new Date(viewY, viewM, 1);
    var lead = (first.getDay() + 6) % 7;
    for (var b = 0; b < lead; b++) html += '<div class="cal-day blank"></div>';

    var total = new Date(viewY, viewM + 1, 0).getDate();
    for (var d = 1; d <= total; d++) {
      var isToday = viewY === today.getFullYear() && viewM === today.getMonth() && d === today.getDate();
      var isOn = viewY === target.getFullYear() && viewM === target.getMonth() && d === target.getDate();
      var cls = 'cal-day' + (isToday ? ' today' : '') + (isOn ? ' on' : '');
      html += '<button type="button" class="' + cls + '" data-d="' + d + '" role="gridcell">' + d + '</button>';
    }
    cal.innerHTML = html;
  }

  function render() {
    today = strip(new Date());
    var diff = dayDiff(target, today);
    var abs = Math.abs(diff);

    /* 状态与天数 */
    if (diff > 0) {
      statusEl.textContent = '还有';
      statusEl.className = 'status future';
      bigEl.innerHTML = '<b>' + abs.toLocaleString('en-US') + '</b><i>天</i>';
    } else if (diff < 0) {
      statusEl.textContent = '已经过去';
      statusEl.className = 'status past';
      bigEl.innerHTML = '<b>' + abs.toLocaleString('en-US') + '</b><i>天</i>';
    } else {
      statusEl.textContent = '就是今天';
      statusEl.className = 'status';
      bigEl.innerHTML = '<b>0</b><i>天</i>';
    }

    targetEl.innerHTML = '<b>' + target.getFullYear() + ' 年 ' + (target.getMonth() + 1) + ' 月 ' +
      target.getDate() + ' 日</b> · ' + WEEK[target.getDay()];

    /* 换算 */
    stWeeks.textContent = Math.floor(abs / 7) + ' 周 ' + (abs % 7) + ' 天';

    var from = diff < 0 ? target : today;
    var to   = diff < 0 ? today : target;
    var mo = (to.getFullYear() - from.getFullYear()) * 12 + (to.getMonth() - from.getMonth());
    var tmp = new Date(from.getFullYear(), from.getMonth() + mo, from.getDate());
    if (tmp > to) { mo -= 1; tmp = new Date(from.getFullYear(), from.getMonth() + mo, from.getDate()); }
    var rest = dayDiff(to, tmp);
    stMonths.textContent = (mo > 0 ? mo + ' 个月 ' : '') + rest + ' 天';
    stYMD.textContent = fmtYMD(ymdDiff(from, to));

    var doy = dayDiff(target, new Date(target.getFullYear(), 0, 1)) + 1;
    stDoy.textContent = doy + ' 天';

    /* 输入框与快捷项状态 */
    syncSegs();
    picker.value = iso(target);
    buildChips();
    for (var i = 0; i < chips.children.length; i++) {
      var b = chips.children[i];
      var on = b.dataset.date === iso(target);
      b.classList.toggle('on', !!on);
    }

    renderCal();
  }

  function setTarget(d, keepView) {
    target = strip(d);
    if (!keepView) { viewY = target.getFullYear(); viewM = target.getMonth(); }
    render();
    try { history.replaceState(null, '', '#' + iso(target)); } catch (e) {}
  }

  /* 交互：年 / 月 / 日 分段输入，填满自动跳下一段 */
  var badTimer = null;
  var normTimer = null;

  function onlyDigits(s, max) { return String(s || '').replace(/\D/g, '').slice(0, max); }
  function focusSeg(el) { if (!el) return; el.focus(); try { el.select(); } catch (e) {} }
  function fieldFocused() { return segs.indexOf(document.activeElement) > -1; }

  function writeSegs() {
    iY.value = target.getFullYear();
    iM.value = p2(target.getMonth() + 1);
    iD.value = p2(target.getDate());
  }
  function syncSegs() { if (!fieldFocused()) writeSegs(); }

  function readSegs() {
    var y = onlyDigits(iY.value, 4);
    if (y.length < 4) return null;                       // 年份没输完先不动
    var m = onlyDigits(iM.value, 2);
    var d = onlyDigits(iD.value, 2);
    return makeDate(+y, m ? +m : 1, d ? +d : 1);         // 只输到年 / 月就按 1 号算
  }

  function commitLive() {
    var d = readSegs();
    if (d) { dateField.classList.remove('invalid'); setTarget(d); }
  }

  function normalize() {
    var y = onlyDigits(iY.value, 4);
    if (!y) { dateField.classList.remove('invalid'); writeSegs(); return; }
    var d = readSegs();
    if (d) {
      dateField.classList.remove('invalid');
      setTarget(d);
      writeSegs();
      return;
    }
    dateField.classList.add('invalid');                  // 日期不存在：抖动并还原
    writeSegs();
    clearTimeout(badTimer);
    badTimer = setTimeout(function () { dateField.classList.remove('invalid'); }, 900);
  }

  iY.addEventListener('input', function () {
    iY.value = onlyDigits(iY.value, 4);
    if (iY.value.length >= 4) focusSeg(iM);              // 年输完 → 跳月
    commitLive();
  });

  iM.addEventListener('input', function () {
    var v = onlyDigits(iM.value, 2);
    if (v.length === 1 && +v >= 2) { v = '0' + v; focusSeg(iD); }   // 单数字月份自动补 0
    else if (v.length >= 2) { focusSeg(iD); }                       // 月输完 → 跳日
    iM.value = v;
    commitLive();
  });

  iD.addEventListener('input', function () {
    var v = onlyDigits(iD.value, 2);
    if (v.length === 1 && +v >= 4) v = '0' + v;          // 单数字日期自动补 0
    iD.value = v;
    commitLive();
  });

  segs.forEach(function (el, idx) {
    el.addEventListener('focus', function () { try { el.select(); } catch (e) {} });

    el.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && el.value === '' && idx > 0) {
        e.preventDefault();
        var prev = segs[idx - 1];
        prev.value = prev.value.slice(0, -1);
        focusSeg(prev);
        commitLive();
      } else if (e.key === 'ArrowLeft' && idx > 0 && el.selectionStart === 0) {
        e.preventDefault(); focusSeg(segs[idx - 1]);
      } else if (e.key === 'ArrowRight' && idx < 2 && el.selectionStart === el.value.length) {
        e.preventDefault(); focusSeg(segs[idx + 1]);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        normalize();
        el.blur();
      } else if (e.key === 'Escape') {
        writeSegs();
        dateField.classList.remove('invalid');
        el.blur();
      }
    });

    el.addEventListener('blur', function () {
      clearTimeout(normTimer);
      normTimer = setTimeout(function () { if (!fieldFocused()) normalize(); }, 0);
    });

    el.addEventListener('paste', function (e) {
      var txt = (e.clipboardData || window.clipboardData).getData('text');
      var p = parseLoose(txt);
      if (!p) return;
      e.preventDefault();
      setTarget(p);
      writeSegs();
      el.blur();
    });
  });

  picker.addEventListener('change', function () {
    var d = parseISO(picker.value);
    if (d) setTarget(d);
  });

  chips.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || !b.dataset.date) return;
    setTarget(parseISO(b.dataset.date));
  });

  cal.addEventListener('click', function (e) {
    var b = e.target.closest('.cal-day[data-d]');
    if (!b) return;
    setTarget(new Date(viewY, viewM, Number(b.dataset.d)), true);
  });

  document.getElementById('prevM').addEventListener('click', function () {
    viewM -= 1;
    if (viewM < 0) { viewM = 11; viewY -= 1; }
    renderCal();
  });
  document.getElementById('nextM').addEventListener('click', function () {
    viewM += 1;
    if (viewM > 11) { viewM = 0; viewY += 1; }
    renderCal();
  });

  /* 初始化 */
  var fromHash = parseISO((location.hash || '').replace('#', ''));
  if (fromHash) { target = fromHash; viewY = target.getFullYear(); viewM = target.getMonth(); }
  render();
  setInterval(render, 30000);   // 跨天自动刷新
})();
</script>
</body>
</html>
